version: '3.8'

services:
  civify-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civify-mcp-server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TRANSPORT=sse
      - CIVIFY_API_URL=https://civify.cv/apis
      # Enable browser OAuth for ChatGPT; store key must be stable across deploys.
      - CIVIFY_MCP_PUBLIC_URL=https://mcp.civify.cv
      - CIVIFY_OAUTH_STORE_KEY=${CIVIFY_OAUTH_STORE_KEY:?Set a stable base64-encoded 32-byte encryption key}
      - CIVIFY_OAUTH_STORE_PATH=/app/data/oauth.enc
      # Exactly one trusted Traefik hop; do not expose the container port directly.
      - CIVIFY_TRUST_PROXY_HOPS=1
    volumes:
      - civify-mcp-data:/app/data
    networks:
      - dokploy-network
    labels:
      # Traefik configuration for Dokploy
      - "traefik.enable=true"
      - "traefik.http.routers.civify-mcp.rule=Host(`mcp.civify.cv`)"
      - "traefik.http.routers.civify-mcp.entrypoints=websecure"
      - "traefik.http.routers.civify-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.civify-mcp.loadbalancer.server.port=8080"
      # Enable Server-Sent Events (SSE) buffering bypass for Traefik
      - "traefik.http.middlewares.mcp-compress.compress=false"
      - "traefik.http.routers.civify-mcp.middlewares=mcp-compress"

networks:
  dokploy-network:
    external: true

volumes:
  civify-mcp-data:
